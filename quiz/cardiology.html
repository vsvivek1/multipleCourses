<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Cardiology Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow exam-hall column; each question is an OMR-style row of A–D bubbles. */
:root {
  --paper: #f4f6fb; --sheet: #ffffff; --ink: #1b2340; --muted: #5b6482;
  --line: #d6dbea; --accent: #2f4bd6; --omr: #c2306b;
  --good: #1f8a4c; --bad: #c0392b; --goodbg: #e5f5ec; --badbg: #fbe9e7;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1424; --sheet: #182036; --ink: #e8ebf6; --muted: #9aa3c0; --line: #2c3654;
  --accent: #8ea0ff; --omr: #f07aa6; --good: #5fd08f; --bad: #ff8a7a; --goodbg: #16352a; --badbg: #3a1e1e; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1424; --sheet: #182036; --ink: #e8ebf6; --muted: #9aa3c0; --line: #2c3654;
  --accent: #8ea0ff; --omr: #f07aa6; --good: #5fd08f; --bad: #ff8a7a; --goodbg: #16352a; --badbg: #3a1e1e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 17px/1.5 var(--body); margin: 0 }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px }
header { display: grid; gap: 4px }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--omr) }
h1 { font: 800 clamp(24px, 5vw, 34px)/1.15 var(--display); margin: 0; text-wrap: balance }
h2 { font: 600 20px/1.25 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0 }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; min-width: 0 }
.modes { display: grid; gap: 10px }
.mode { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%;
  background: var(--sheet); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 16px; font: inherit; cursor: pointer }
.mode:hover, .mode:focus-visible { border-color: var(--accent); outline: none }
.mode b { font-family: var(--display); font-weight: 600 }
.mode small { color: var(--muted); grid-column: 1 }
.mode .go { grid-row: 1 / span 2; grid-column: 2; font: 500 13px var(--mono); color: var(--accent) }
label.f { display: grid; gap: 6px; font-weight: 600 }
select { font: inherit; padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); width: 100% }
.rules { font: 500 13px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 14px var(--mono); color: var(--muted); flex-wrap: wrap }
.timer.low { color: var(--bad) }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }
.qtopic { font: 500 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.qtext { font-size: 19px; font-weight: 600; margin: 0 }
.opts { display: grid; gap: 10px }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer }
.opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--accent); outline: none }
.bub { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--omr); display: grid; place-items: center; font: 500 14px var(--mono); color: var(--omr) }
.opt.picked .bub { background: var(--omr); color: var(--sheet) }
.opt.right { border-color: var(--good); background: var(--goodbg) }
.opt.right .bub { border-color: var(--good); background: var(--good); color: var(--sheet) }
.opt.wrong { border-color: var(--bad); background: var(--badbg) }
.opt.wrong .bub { border-color: var(--bad); background: var(--bad); color: var(--sheet) }
.opt:disabled { cursor: default }
.explain { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--ink); margin: 0 }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end }
.btn { font: 600 16px var(--body); border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--sheet) }
.btn.ghost { background: transparent; color: var(--accent) }
.btn:focus-visible { outline: 3px solid var(--omr); outline-offset: 2px }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px }
.score div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid }
.score b { font: 600 26px var(--mono); font-variant-numeric: tabular-nums }
.score span { font-size: 13px; color: var(--muted) }
.review { display: grid; gap: 14px; margin: 0; padding-left: 22px }
.review li { display: grid; gap: 4px }
.review .ans { font-size: 15px; color: var(--muted) }
.tag { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 4px }
.tag.ok { background: var(--goodbg); color: var(--good) } .tag.no { background: var(--badbg); color: var(--bad) } .tag.sk { background: var(--line); color: var(--muted) }
.share { width: 100%; font: 15px var(--body); padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical }
.note { font-size: 13px; color: var(--muted); margin: 0 }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Kerala PSC practice quiz</span>
    <h1 id="title"></h1>
    <p class="sub" id="meta"></p>
  </header>
  <main id="app" class="sheet" aria-live="polite"></main>
  <p class="note">Practice questions written to the exam pattern, not taken from past papers. Content is awaiting expert review.</p>
</div>

<script>
const PACK = {"course": {"id": "psc_cardiology", "title": {"en": "Kerala PSC Assistant Professor — Cardiology"}, "audience": "adult", "languages": ["en"], "exam": {"name": "Kerala PSC Assistant Professor (Cardiology), Medical Education", "date": "2027-06-30", "status": "estimated", "source": "http://www.keralapsc.gov.in/sites/default/files/2025-01/DM%20Cardiology.pdf"}}, "topics": [{"id": "cardio.m01.anatomy-physiology", "subject": "module01", "title": {"en": "Applied anatomy, physiology, pharmacology, embryology & pathology"}}, {"id": "cardio.m01.investigations", "subject": "module01", "title": {"en": "Cardiac investigations (ECG, X-ray, echo, cath, CT/MRI, PET, CAD physiology)"}}, {"id": "cardio.m01.genetics", "subject": "module01", "title": {"en": "Genetics and gene therapy in CVD"}}, {"id": "cardio.m02.atherosclerotic", "subject": "module02", "title": {"en": "Atherosclerotic heart disease: ACS and CCS"}}, {"id": "cardio.m02.valvular", "subject": "module02", "title": {"en": "Valvular heart disease"}}, {"id": "cardio.m02.congenital", "subject": "module02", "title": {"en": "Congenital heart disease: cyanotic and acyanotic"}}, {"id": "cardio.m03.heart-failure", "subject": "module03", "title": {"en": "Heart failure: ADHF and CHF"}}, {"id": "cardio.m03.hypertension", "subject": "module03", "title": {"en": "Hypertension"}}, {"id": "cardio.m03.arrhythmia", "subject": "module03", "title": {"en": "Arrhythmia management and sudden cardiac death"}}, {"id": "cardio.m04.cardiomyopathy", "subject": "module04", "title": {"en": "Cardiomyopathy"}}, {"id": "cardio.m05.pericardial", "subject": "module05", "title": {"en": "Pericardial diseases"}}, {"id": "cardio.m06.endocarditis", "subject": "module06", "title": {"en": "Infective endocarditis"}}, {"id": "cardio.m06.prosthetic-valves", "subject": "module06", "title": {"en": "Prosthetic valve disease and percutaneous valve replacement"}}, {"id": "cardio.m07.pulmonary-hypertension", "subject": "module07", "title": {"en": "Pulmonary hypertension and PAH"}}, {"id": "cardio.m08.stroke", "subject": "module08", "title": {"en": "Stroke and cardiovascular disease"}}, {"id": "cardio.m08.atrial-fibrillation", "subject": "module08", "title": {"en": "Atrial fibrillation management"}}, {"id": "cardio.m09.noncardiac-surgery", "subject": "module09", "title": {"en": "Cardiac evaluation for non-cardiac surgery and anaesthesia"}}, {"id": "cardio.m10.aorta", "subject": "module10", "title": {"en": "Aortic diseases and interventions"}}, {"id": "cardio.m10.pad", "subject": "module10", "title": {"en": "Peripheral arterial occlusive disease"}}, {"id": "cardio.m10.diabetes-lipids", "subject": "module10", "title": {"en": "Diabetes, dyslipidaemia and CVD"}}, {"id": "cardio.m10.pregnancy", "subject": "module10", "title": {"en": "Pregnancy and heart disease"}}, {"id": "cardio.m10.pulmonary-embolism", "subject": "module10", "title": {"en": "Pulmonary embolism"}}], "questions": [{"id": "q.practice.1", "topic": "cardio.m01.anatomy-physiology", "kind": "mcq", "q": {"en": "Coronary dominance is determined by the artery that gives rise to the:"}, "options": [{"en": "Posterior descending artery"}, {"en": "SA nodal artery"}, {"en": "Obtuse marginal artery"}, {"en": "Conus artery"}], "answer": 0, "explain": {"en": "Dominance is defined by the origin of the PDA."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.anatomy-physiology.f01"]}, {"id": "q.practice.2", "topic": "cardio.m01.anatomy-physiology", "kind": "mcq", "q": {"en": "Free-wall rupture after myocardial infarction is most likely at:"}, "options": [{"en": "First 6 hours"}, {"en": "3–7 days"}, {"en": "3–4 weeks"}, {"en": "3 months"}], "answer": 1, "explain": {"en": "Necrotic muscle is cleared before scar forms, so the wall is weakest at 3–7 days."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.anatomy-physiology.f07"]}, {"id": "q.practice.3", "topic": "cardio.m01.anatomy-physiology", "kind": "mcq", "q": {"en": "Digoxin toxicity is precipitated most by:"}, "options": [{"en": "Hyperkalaemia"}, {"en": "Hypokalaemia"}, {"en": "Hypernatraemia"}, {"en": "Hypocalcaemia"}], "answer": 1, "explain": {"en": "Potassium competes with digoxin at the Na⁺/K⁺-ATPase; low potassium increases binding."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.anatomy-physiology.f06"]}, {"id": "q.practice.4", "topic": "cardio.m01.investigations", "kind": "mcq", "q": {"en": "Fractional flow reserve indicating a haemodynamically significant stenosis is:"}, "options": [{"en": "≤0.95"}, {"en": "≤0.90"}, {"en": "≤0.80"}, {"en": "≤0.60"}], "answer": 2, "explain": {"en": "FFR ≤0.80 marks a functionally significant lesion."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.investigations.f05"]}, {"id": "q.practice.5", "topic": "cardio.m01.investigations", "kind": "mcq", "q": {"en": "Duke treadmill score for 9 min exercise, 1 mm ST depression and no angina:"}, "options": [{"en": "+4"}, {"en": "+9"}, {"en": "−1"}, {"en": "+14"}], "answer": 0, "explain": {"en": "9 − 5×1 − 4×0 = +4 (intermediate risk)."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.investigations.m01"]}, {"id": "q.practice.6", "topic": "cardio.m01.investigations", "kind": "mcq", "q": {"en": "Hibernating myocardium on PET shows:"}, "options": [{"en": "Matched reduction of perfusion and FDG"}, {"en": "Perfusion–FDG mismatch"}, {"en": "Normal perfusion, absent FDG"}, {"en": "Increased perfusion and FDG"}], "answer": 1, "explain": {"en": "Reduced perfusion with preserved glucose use = viable, hibernating myocardium."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.investigations.f06"]}, {"id": "q.practice.7", "topic": "cardio.m01.genetics", "kind": "mcq", "q": {"en": "Long QT syndrome type 1 is classically triggered by:"}, "options": [{"en": "Sleep"}, {"en": "Swimming"}, {"en": "Loud alarm clock"}, {"en": "Hypothermia"}], "answer": 1, "explain": {"en": "LQT1 (KCNQ1): exercise, especially swimming."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.genetics.f03"]}, {"id": "q.practice.8", "topic": "cardio.m01.genetics", "kind": "mcq", "q": {"en": "Inclisiran lowers LDL-C by:"}, "options": [{"en": "Monoclonal antibody to PCSK9"}, {"en": "siRNA silencing of PCSK9 synthesis"}, {"en": "Inhibiting NPC1L1"}, {"en": "Inhibiting ACL"}], "answer": 1, "explain": {"en": "Inclisiran is an siRNA that stops hepatic PCSK9 production."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.genetics.f05"]}, {"id": "q.practice.9", "topic": "cardio.m01.investigations", "kind": "mcq", "q": {"en": "On a regular ECG the R–R interval is 3 large squares. The heart rate is:"}, "options": [{"en": "60/min"}, {"en": "75/min"}, {"en": "100/min"}, {"en": "150/min"}], "answer": 2, "explain": {"en": "300 ÷ 3 = 100 beats/min."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.investigations.m02"]}, {"id": "q.practice.10", "topic": "cardio.m01.genetics", "kind": "mcq", "q": {"en": "The commonest gene implicated in familial hypercholesterolaemia is:"}, "options": [{"en": "APOB"}, {"en": "PCSK9"}, {"en": "LDLR"}, {"en": "LDLRAP1"}], "answer": 2, "explain": {"en": "LDLR variants cause most FH."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m01.genetics.f02"]}, {"id": "q.practice.11", "topic": "cardio.m02.atherosclerotic", "kind": "mcq", "q": {"en": "In STEMI, primary PCI is preferred over fibrinolysis when it can be done within how long of diagnosis?"}, "options": [{"en": "30 minutes"}, {"en": "60 minutes"}, {"en": "120 minutes"}, {"en": "12 hours"}], "answer": 2, "explain": {"en": "ESC: primary PCI if expected diagnosis-to-wire time is 120 minutes or less."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m02.atherosclerotic.sum"]}, {"id": "q.practice.12", "topic": "cardio.m02.atherosclerotic", "kind": "mcq", "q": {"en": "ESC LDL-C goal for a patient after acute coronary syndrome is:"}, "options": [{"en": "Under 116 mg/dL"}, {"en": "Under 100 mg/dL"}, {"en": "Under 70 mg/dL"}, {"en": "Under 55 mg/dL"}], "answer": 3, "explain": {"en": "Very-high-risk patients, including post-ACS, target LDL-C under 55 mg/dL with at least 50% reduction."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m02.atherosclerotic.sum"]}, {"id": "q.practice.13", "topic": "cardio.m02.valvular", "kind": "mcq", "q": {"en": "Which finding defines severe aortic stenosis?"}, "options": [{"en": "Mean gradient 20 mmHg"}, {"en": "Peak velocity 4 m/s or more"}, {"en": "Valve area 1.8 cm²"}, {"en": "Peak velocity 2.5 m/s"}], "answer": 1, "explain": {"en": "Severe AS: Vmax ≥4 m/s, mean gradient ≥40 mmHg, AVA under 1.0 cm²."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m02.valvular.sum"]}, {"id": "q.practice.14", "topic": "cardio.m02.valvular", "kind": "mcq", "q": {"en": "A contraindication to percutaneous transmitral commissurotomy (PTMC) is:"}, "options": [{"en": "Valve area 1.2 cm²"}, {"en": "Left atrial thrombus"}, {"en": "Sinus rhythm"}, {"en": "Pliable valve leaflets"}], "answer": 1, "explain": {"en": "PTMC needs no LA thrombus and at most mild MR; LA thrombus risks embolism."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m02.valvular.sum"]}, {"id": "q.practice.15", "topic": "cardio.m02.congenital", "kind": "mcq", "q": {"en": "The commonest congenital heart defect is:"}, "options": [{"en": "Atrial septal defect"}, {"en": "Ventricular septal defect"}, {"en": "Tetralogy of Fallot"}, {"en": "Patent ductus arteriosus"}], "answer": 1, "explain": {"en": "VSD is the commonest congenital heart defect (excluding bicuspid aortic valve)."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m02.congenital.sum"]}, {"id": "q.practice.16", "topic": "cardio.m02.congenital", "kind": "mcq", "q": {"en": "The commonest cyanotic congenital heart lesion presenting in the newborn period is:"}, "options": [{"en": "Tetralogy of Fallot"}, {"en": "Transposition of the great arteries"}, {"en": "Tricuspid atresia"}, {"en": "Ebstein anomaly"}], "answer": 1, "explain": {"en": "TGA presents in newborns; Tetralogy is the commonest cyanotic lesion after infancy."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m02.congenital.sum"]}, {"id": "q.practice.17", "topic": "cardio.m03.heart-failure", "kind": "mcq", "q": {"en": "Heart failure with mildly reduced ejection fraction (HFmrEF) has an LVEF of:"}, "options": [{"en": "≤40%"}, {"en": "41–49%"}, {"en": "50–55%"}, {"en": "≥55%"}], "answer": 1, "explain": {"en": "HFrEF ≤40%, HFmrEF 41–49%, HFpEF ≥50%."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m03.heart-failure.sum"]}, {"id": "q.practice.18", "topic": "cardio.m03.heart-failure", "kind": "mcq", "q": {"en": "Which is NOT one of the four pillars of HFrEF therapy?"}, "options": [{"en": "SGLT2 inhibitor"}, {"en": "Mineralocorticoid receptor antagonist"}, {"en": "Digoxin"}, {"en": "Beta-blocker"}], "answer": 2, "explain": {"en": "The four pillars are ARNI/ACEi/ARB, beta-blocker, MRA and SGLT2 inhibitor. Digoxin is add-on only."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m03.heart-failure.sum"]}, {"id": "q.practice.19", "topic": "cardio.m03.hypertension", "kind": "mcq", "q": {"en": "Resistant hypertension is BP above target despite three drugs including a diuretic. The preferred fourth drug is:"}, "options": [{"en": "Spironolactone"}, {"en": "Hydralazine"}, {"en": "Clonidine"}, {"en": "Minoxidil"}], "answer": 0, "explain": {"en": "PATHWAY-2 supports spironolactone as the fourth-line drug."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m03.hypertension.sum"]}, {"id": "q.practice.20", "topic": "cardio.m03.hypertension", "kind": "mcq", "q": {"en": "Per ESC/ISH, hypertension is diagnosed at an office BP of:"}, "options": [{"en": "≥130/80 mmHg"}, {"en": "≥135/85 mmHg"}, {"en": "≥140/90 mmHg"}, {"en": "≥160/100 mmHg"}], "answer": 2, "explain": {"en": "ESC/ISH define hypertension as office BP ≥140/90 mmHg."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m03.hypertension.sum"]}, {"id": "q.practice.21", "topic": "cardio.m03.arrhythmia", "kind": "mcq", "q": {"en": "In the Vaughan Williams classification, class III drugs act mainly by blocking:"}, "options": [{"en": "Sodium channels"}, {"en": "Beta receptors"}, {"en": "Potassium channels"}, {"en": "Calcium channels"}], "answer": 2, "explain": {"en": "Class I Na, II beta, III K, IV Ca."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m03.arrhythmia.sum"]}, {"id": "q.practice.22", "topic": "cardio.m03.arrhythmia", "kind": "mcq", "q": {"en": "Primary-prevention ICD is indicated when LVEF stays at or below what value after 3 months of optimal therapy (NYHA II–III)?"}, "options": [{"en": "25%"}, {"en": "35%"}, {"en": "45%"}, {"en": "50%"}], "answer": 1, "explain": {"en": "LVEF ≤35% after ≥3 months of optimal medical therapy."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m03.arrhythmia.sum"]}, {"id": "q.practice.23", "topic": "cardio.m04.cardiomyopathy", "kind": "mcq", "q": {"en": "Left ventricular outflow tract obstruction in HCM is defined by a gradient of at least:"}, "options": [{"en": "10 mmHg"}, {"en": "20 mmHg"}, {"en": "30 mmHg"}, {"en": "50 mmHg"}], "answer": 2, "explain": {"en": "LVOTO is a gradient ≥30 mmHg; ≥50 mmHg is usually the threshold for invasive therapy."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m04.cardiomyopathy.sum"]}, {"id": "q.practice.24", "topic": "cardio.m04.cardiomyopathy", "kind": "mcq", "q": {"en": "An epsilon wave on ECG is characteristic of:"}, "options": [{"en": "Hypertrophic cardiomyopathy"}, {"en": "Arrhythmogenic right ventricular cardiomyopathy"}, {"en": "Cardiac amyloidosis"}, {"en": "Dilated cardiomyopathy"}], "answer": 1, "explain": {"en": "Epsilon waves reflect delayed RV activation in ARVC."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m04.cardiomyopathy.sum"]}, {"id": "q.practice.25", "topic": "cardio.m05.pericardial", "kind": "mcq", "q": {"en": "Colchicine is added to NSAIDs in acute pericarditis mainly to:"}, "options": [{"en": "Relieve pain faster"}, {"en": "Reduce recurrence"}, {"en": "Prevent tamponade"}, {"en": "Lower ESR"}], "answer": 1, "explain": {"en": "Colchicine roughly halves recurrence (COPE, ICAP trials)."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m05.pericardial.sum"]}, {"id": "q.practice.26", "topic": "cardio.m05.pericardial", "kind": "mcq", "q": {"en": "Kussmaul sign is most typical of:"}, "options": [{"en": "Cardiac tamponade"}, {"en": "Constrictive pericarditis"}, {"en": "Acute pericarditis"}, {"en": "Pericardial cyst"}], "answer": 1, "explain": {"en": "JVP rising on inspiration is a classic sign of constriction; tamponade shows pulsus paradoxus."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m05.pericardial.sum"]}, {"id": "q.practice.27", "topic": "cardio.m06.endocarditis", "kind": "mcq", "q": {"en": "The commonest organism causing infective endocarditis overall is:"}, "options": [{"en": "Streptococcus viridans"}, {"en": "Staphylococcus aureus"}, {"en": "Enterococcus faecalis"}, {"en": "HACEK group"}], "answer": 1, "explain": {"en": "S. aureus is now the leading cause in most series."}, "source": "Practice — exam pattern (not from a past paper)", "covers": ["cardio.m06.endocarditis.sum"]}, {"id": "q.practice.28", "topic": "cardio.m06.endocarditis", "kind": "mcq", "q": {"en": "Antibiotic prophylaxis against endo exam pattern (not from a past paper)", "covers": ["cardio.m10.pulmonary-embolism.sum"]}]};
const RIGHT = 1, WRONG = 1 / 3;               // Kerala PSC: +1 correct, −1/3 wrong, 0 skipped
const SEC_PER_Q = 72;                          // OMR objective papers: about 100 questions in 120 minutes
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k.startsWith("on") ? e[k] = v : e.setAttribute(k, v);
  for (const k of kids) e.append(k); return e; };
const L = "en", t = o => (o && (o[L] || Object.values(o)[0])) || "";
const topics = Object.fromEntries(PACK.topics.map(x => [x.id, x]));
const modules = [...new Set(PACK.topics.map(x => x.subject))];
const modName = m => "Module " + parseInt(m.replace(/\D/g, ""), 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const BEST = "quiz-best-" + PACK.course.id;
let S = null, tick = null;

$("#title").textContent = t(PACK.course.title).replace(/^Kerala PSC\s*/, "");
$("#meta").textContent = `${PACK.questions.length} questions · ${PACK.topics.length} topics · ${PACK.course.exam.name}`;

function home() {
  clearInterval(tick);
  const app = $("#app"); app.replaceChildren();
  const best = store.get(BEST);
  const sel = el("select", { id: "module" }, el("option", { value: "" }, "All modules"),
    ...modules.map(m => el("option", { value: m }, `${modName(m)} · ${PACK.questions.filter(q => topics[q.topic]?.subject === m).length} questions`)));
  const mode = (name, desc, cta, fn) => el("button", { class: "mode", onclick: fn }, el("b", {}, name), el("small", {}, desc), el("span", { class: "go" }, cta));
  app.append(
    el("h2", {}, "Choose a quiz"),
    el("label", { class: "f", for: "module" }, "Syllabus module", sel),
    el("div", { class: "modes" },
      mode("Quick test", "5 questions, answer shown after each one", "5 Q →", () => start(5, false)),
      mode("Mini test", "10 questions, answer shown after each one", "10 Q →", () => start(10, false)),
      mode("Mock exam", "Every question in the module, timed, results at the end", "Timed →", () => start(0, true))),
    el("div", { class: "rules" }, el("span", {}, "+1 correct"), el("span", {}, "−⅓ wrong"), el("span", {}, "0 skipped"),
      el("span", {}, best ? `Best: ${best.pct}% (${best.label})` : "No attempts yet")));
}

function start(n, mock) {
  const m = $("#module").value;
  let pool = PACK.questions.filter(q => !m || topics[q.topic]?.subject === m);
  pool = shuffle(pool); if (n) pool = pool.slice(0, n);
  // Shuffle options each attempt so the answer letter cannot be memorised.
  pool = pool.map(q => { const ord = shuffle(q.options.map((_, k) => k)); return { ...q, options: ord.map(k => q.options[k]), answer: ord.indexOf(q.answer) }; });
  S = { qs: pool, i: 0, picks: Array(pool.length).fill(null), mock, label: (m ? modName(m) : "All modules") + (mock ? " mock" : n === 5 ? " quick test" : " mini test"),
        left: mock ? pool.length * SEC_PER_Q : 0 };
  if (mock) tick = setInterval(() => { S.left--; const tm = $(".timer"); if (tm) { tm.textContent = clock(S.left); tm.classList.toggle("low", S.left < 60); } if (S.left <= 0) finish(); }, 1000);
  show();
}
const clock = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;

function show() {
  const q = S.qs[S.i], app = $("#app"), pick = S.picks[S.i], locked = !S.mock && pick !== null;
  app.replaceChildren();
  const opts = q.options.map((o, k) => {
    let cls = "opt"; if (pick === k) cls += " picked";
    if (locked) { if (k === q.answer) cls += " right"; else if (k === pick) cls += " wrong"; }
    const b = el("button", { class: cls, id: `opt-${k}`, onclick: () => { if (locked) return; S.picks[S.i] = S.mock && pick === k ? null : k; show(); } },
      el("span", { class: "bub", "aria-hidden": "true" }, "ABCD"[k]), el("span", {}, t(o)));
    if (locked) b.disabled = true; return b; });
  const last = S.i === S.qs.length - 1;
  const actions = el("div", { class: "actions" });
  if (S.mock && S.i > 0) actions.append(el("button", { class: "btn ghost", onclick: () => { S.i--; show(); } }, "Previous"));
  if (S.mock || locked) actions.append(el("button", { class: "btn", onclick: () => last ? finish() : (S.i++, show()) }, last ? "See result" : "Next question"));
  else actions.append(el("button", { class: "btn ghost", onclick: () => last ? finish() : (S.i++, show()) }, last ? "Skip and finish" : "Skip"));
  app.append(
    el("div", { class: "bar" }, el("span", {}, `Q ${S.i + 1} / ${S.qs.length}`), S.mock ? el("span", { class: "timer" }, clock(S.left)) : el("span", {}, S.label)),
    el("div", { class: "progress" }, el("i", { style: `width:${(S.i / S.qs.length) * 100}%` })),
    el("span", { class: "qtopic" }, t(topics[q.topic]?.title)),
    el("p", { class: "qtext" }, t(q.q)),
    el("div", { class: "opts" }, ...opts),
    ...(locked ? [el("p", { class: "explain" }, (pick === q.answer ? "Correct. " : `Answer: ${"ABCD"[q.answer]}. `) + t(q.explain))] : []),
    actions);
}

function finish() {
  clearInterval(tick);
  const c = S.picks.filter((p, i) => p === S.qs[i].answer).length, sk = S.picks.filter(p => p === null).length, w = S.qs.length - c - sk;
  const marks = c * RIGHT - w * WRONG, pct = Math.max(0, Math.round(marks / S.qs.length * 100));
  const best = store.get(BEST); if (!best || pct > best.pct) store.set(BEST, { pct, label: S.label });
  const weak = [...new Set(S.qs.filter((q, i) => S.picks[i] !== q.answer).map(q => t(topics[q.topic]?.title)))];
  const share = `I scored ${marks.toFixed(2)}/${S.qs.length} (${pct}%) in the ${t(PACK.course.title)} ${S.label}. Can you beat it?`;
  const app = $("#app"); app.replaceChildren();
  const ta = el("textarea", { class: "share", id: "share", rows: "2", readonly: "" }); ta.value = share;
  app.append(
    el("h2", {}, `${S.label}: ${marks.toFixed(2)} / ${S.qs.length} marks`),
    el("div", { class: "score" }, ...[[c, "correct"], [w, "wrong (−⅓ each)"], [sk, "skipped"], [pct + "%", "score"]].map(([n, l]) => el("div", {}, el("b", {}, String(n)), el("span", {}, l)))),
    weak.length ? el("p", {}, el("b", {}, "Revise next: "), weak.join("; ")) : el("p", {}, "Full marks. Try the mock exam next."),
    el("label", { class: "f", for: "share" }, "Share your score", ta),
    el("div", { class: "actions" },
      el("button", { class: "btn ghost", onclick: e => { navigator.clipboard?.writeText(share).then(() => e.target.textContent = "Copied", () => ta.select()) ?? ta.select(); } }, "Copy score"),
      el("button", { class: "btn", onclick: home }, "New quiz")),
    el("h2", {}, "Answer review"),
    el("ol", { class: "review" }, ...S.qs.map((q, i) => { const p = S.picks[i];
      const tag = p === null ? el("span", { class: "tag sk" }, "skipped") : p === q.answer ? el("span", { class: "tag ok" }, "correct") : el("span", { class: "tag no" }, `you: ${"ABCD"[p]}`);
      return el("li", {}, el("span", {}, t(q.q), " ", tag), el("span", { class: "ans" }, `${"ABCD"[q.answer]}. ${t(q.options[q.answer])} · ${t(q.explain)}`)); })));
  app.scrollIntoView({ block: "start" });
}
home();
</script>
