<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow exam-hall column; each question is an OMR-style row of A–D bubbles. */
:root {
  --paper: #f4f6fb; --sheet: #ffffff; --ink: #1b2340; --muted: #5b6482;
  --line: #d6dbea; --accent: #2f4bd6; --omr: #c2306b;
  --good: #1f8a4c; --bad: #c0392b; --goodbg: #e5f5ec; --badbg: #fbe9e7;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1424; --sheet: #182036; --ink: #e8ebf6; --muted: #9aa3c0; --line: #2c3654;
  --accent: #8ea0ff; --omr: #f07aa6; --good: #5fd08f; --bad: #ff8a7a; --goodbg: #16352a; --badbg: #3a1e1e; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1424; --sheet: #182036; --ink: #e8ebf6; --muted: #9aa3c0; --line: #2c3654;
  --accent: #8ea0ff; --omr: #f07aa6; --good: #5fd08f; --bad: #ff8a7a; --goodbg: #16352a; --badbg: #3a1e1e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 17px/1.5 var(--body); margin: 0 }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px }
header { display: grid; gap: 4px }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--omr) }
h1 { font: 800 clamp(24px, 5vw, 34px)/1.15 var(--display); margin: 0; text-wrap: balance }
h2 { font: 600 20px/1.25 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0 }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; min-width: 0 }
.modes { display: grid; gap: 10px }
.mode { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%;
  background: var(--sheet); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 16px; font: inherit; cursor: pointer }
.mode:hover, .mode:focus-visible { border-color: var(--accent); outline: none }
.mode b { font-family: var(--display); font-weight: 600 }
.mode small { color: var(--muted); grid-column: 1 }
.mode .go { grid-row: 1 / span 2; grid-column: 2; font: 500 13px var(--mono); color: var(--accent) }
label.f { display: grid; gap: 6px; font-weight: 600 }
select { font: inherit; padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); width: 100% }
.rules { font: 500 13px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 14px var(--mono); color: var(--muted); flex-wrap: wrap }
.timer.low { color: var(--bad) }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }
.qtopic { font: 500 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.qtext { font-size: 19px; font-weight: 600; margin: 0 }
.opts { display: grid; gap: 10px }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer }
.opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--accent); outline: none }
.bub { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--omr); display: grid; place-items: center; font: 500 14px var(--mono); color: var(--omr) }
.opt.picked .bub { background: var(--omr); color: var(--sheet) }
.opt.right { border-color: var(--good); background: var(--goodbg) }
.opt.right .bub { border-color: var(--good); background: var(--good); color: var(--sheet) }
.opt.wrong { border-color: var(--bad); background: var(--badbg) }
.opt.wrong .bub { border-color: var(--bad); background: var(--bad); color: var(--sheet) }
.opt:disabled { cursor: default }
.explain { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--ink); margin: 0 }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end }
.btn { font: 600 16px var(--body); border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--sheet) }
.btn.ghost { background: transparent; color: var(--accent) }
.btn:focus-visible { outline: 3px solid var(--omr); outline-offset: 2px }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px }
.score div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid }
.score b { font: 600 26px var(--mono); font-variant-numeric: tabular-nums }
.score span { font-size: 13px; color: var(--muted) }
.review { display: grid; gap: 14px; margin: 0; padding-left: 22px }
.review li { display: grid; gap: 4px }
.review .ans { font-size: 15px; color: var(--muted) }
.tag { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 4px }
.tag.ok { background: var(--goodbg); color: var(--good) } .tag.no { background: var(--badbg); color: var(--bad) } .tag.sk { background: var(--line); color: var(--muted) }
.share { width: 100%; font: 15px var(--body); padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical }
.note { font-size: 13px; color: var(--muted); margin: 0 }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Kerala PSC practice quiz</span>
    <h1 id="title"></h1>
    <p class="sub" id="meta"></p>
  </header>
  <main id="app" class="sheet" aria-live="polite"></main>
  <p class="note">Practice questions written to the exam pattern, not taken from past papers. Content is awaiting expert review.</p>
</div>

<script>
const PACK = /*__PACK__*/null;
const RIGHT = 1, WRONG = 1 / 3;               // Kerala PSC: +1 correct, −1/3 wrong, 0 skipped
const SEC_PER_Q = 72;                          // OMR objective papers: about 100 questions in 120 minutes
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k.startsWith("on") ? e[k] = v : e.setAttribute(k, v);
  for (const k of kids) e.append(k); return e; };
const L = "en", t = o => (o && (o[L] || Object.values(o)[0])) || "";
const topics = Object.fromEntries(PACK.topics.map(x => [x.id, x]));
const modules = [...new Set(PACK.topics.map(x => x.subject))];
const modName = m => "Module " + parseInt(m.replace(/\D/g, ""), 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const BEST = "quiz-best-" + PACK.course.id;
let S = null, tick = null;

$("#title").textContent = t(PACK.course.title).replace(/^Kerala PSC\s*/, "");
$("#meta").textContent = `${PACK.questions.length} questions · ${PACK.topics.length} topics · ${PACK.course.exam.name}`;

function home() {
  clearInterval(tick);
  const app = $("#app"); app.replaceChildren();
  const best = store.get(BEST);
  const sel = el("select", { id: "module" }, el("option", { value: "" }, "All modules"),
    ...modules.map(m => el("option", { value: m }, `${modName(m)} · ${PACK.questions.filter(q => topics[q.topic]?.subject === m).length} questions`)));
  const mode = (name, desc, cta, fn) => el("button", { class: "mode", onclick: fn }, el("b", {}, name), el("small", {}, desc), el("span", { class: "go" }, cta));
  app.append(
    el("h2", {}, "Choose a quiz"),
    el("label", { class: "f", for: "module" }, "Syllabus module", sel),
    el("div", { class: "modes" },
      mode("Quick test", "5 questions, answer shown after each one", "5 Q →", () => start(5, false)),
      mode("Mini test", "10 questions, answer shown after each one", "10 Q →", () => start(10, false)),
      mode("Mock exam", "Every question in the module, timed, results at the end", "Timed →", () => start(0, true))),
    el("div", { class: "rules" }, el("span", {}, "+1 correct"), el("span", {}, "−⅓ wrong"), el("span", {}, "0 skipped"),
      el("span", {}, best ? `Best: ${best.pct}% (${best.label})` : "No attempts yet")));
}

function start(n, mock) {
  const m = $("#module").value;
  let pool = PACK.questions.filter(q => !m || topics[q.topic]?.subject === m);
  pool = shuffle(pool); if (n) pool = pool.slice(0, n);
  // Shuffle options each attempt so the answer letter cannot be memorised.
  pool = pool.map(q => { const ord = shuffle(q.options.map((_, k) => k)); return { ...q, options: ord.map(k => q.options[k]), answer: ord.indexOf(q.answer) }; });
  S = { qs: pool, i: 0, picks: Array(pool.length).fill(null), mock, label: (m ? modName(m) : "All modules") + (mock ? " mock" : n === 5 ? " quick test" : " mini test"),
        left: mock ? pool.length * SEC_PER_Q : 0 };
  if (mock) tick = setInterval(() => { S.left--; const tm = $(".timer"); if (tm) { tm.textContent = clock(S.left); tm.classList.toggle("low", S.left < 60); } if (S.left <= 0) finish(); }, 1000);
  show();
}
const clock = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;

function show() {
  const q = S.qs[S.i], app = $("#app"), pick = S.picks[S.i], locked = !S.mock && pick !== null;
  app.replaceChildren();
  const opts = q.options.map((o, k) => {
    let cls = "opt"; if (pick === k) cls += " picked";
    if (locked) { if (k === q.answer) cls += " right"; else if (k === pick) cls += " wrong"; }
    const b = el("button", { class: cls, id: `opt-${k}`, onclick: () => { if (locked) return; S.picks[S.i] = S.mock && pick === k ? null : k; show(); } },
      el("span", { class: "bub", "aria-hidden": "true" }, "ABCD"[k]), el("span", {}, t(o)));
    if (locked) b.disabled = true; return b; });
  const last = S.i === S.qs.length - 1;
  const actions = el("div", { class: "actions" });
  if (S.mock && S.i > 0) actions.append(el("button", { class: "btn ghost", onclick: () => { S.i--; show(); } }, "Previous"));
  if (S.mock || locked) actions.append(el("button", { class: "btn", onclick: () => last ? finish() : (S.i++, show()) }, last ? "See result" : "Next question"));
  else actions.append(el("button", { class: "btn ghost", onclick: () => last ? finish() : (S.i++, show()) }, last ? "Skip and finish" : "Skip"));
  app.append(
    el("div", { class: "bar" }, el("span", {}, `Q ${S.i + 1} / ${S.qs.length}`), S.mock ? el("span", { class: "timer" }, clock(S.left)) : el("span", {}, S.label)),
    el("div", { class: "progress" }, el("i", { style: `width:${(S.i / S.qs.length) * 100}%` })),
    el("span", { class: "qtopic" }, t(topics[q.topic]?.title)),
    el("p", { class: "qtext" }, t(q.q)),
    el("div", { class: "opts" }, ...opts),
    ...(locked ? [el("p", { class: "explain" }, (pick === q.answer ? "Correct. " : `Answer: ${"ABCD"[q.answer]}. `) + t(q.explain))] : []),
    actions);
}

function finish() {
  clearInterval(tick);
  const c = S.picks.filter((p, i) => p === S.qs[i].answer).length, sk = S.picks.filter(p => p === null).length, w = S.qs.length - c - sk;
  const marks = c * RIGHT - w * WRONG, pct = Math.max(0, Math.round(marks / S.qs.length * 100));
  const best = store.get(BEST); if (!best || pct > best.pct) store.set(BEST, { pct, label: S.label });
  const weak = [...new Set(S.qs.filter((q, i) => S.picks[i] !== q.answer).map(q => t(topics[q.topic]?.title)))];
  const share = `I scored ${marks.toFixed(2)}/${S.qs.length} (${pct}%) in the ${t(PACK.course.title)} ${S.label}. Can you beat it?`;
  const app = $("#app"); app.replaceChildren();
  const ta = el("textarea", { class: "share", id: "share", rows: "2", readonly: "" }); ta.value = share;
  app.append(
    el("h2", {}, `${S.label}: ${marks.toFixed(2)} / ${S.qs.length} marks`),
    el("div", { class: "score" }, ...[[c, "correct"], [w, "wrong (−⅓ each)"], [sk, "skipped"], [pct + "%", "score"]].map(([n, l]) => el("div", {}, el("b", {}, String(n)), el("span", {}, l)))),
    weak.length ? el("p", {}, el("b", {}, "Revise next: "), weak.join("; ")) : el("p", {}, "Full marks. Try the mock exam next."),
    el("label", { class: "f", for: "share" }, "Share your score", ta),
    el("div", { class: "actions" },
      el("button", { class: "btn ghost", onclick: e => { navigator.clipboard?.writeText(share).then(() => e.target.textContent = "Copied", () => ta.select()) ?? ta.select(); } }, "Copy score"),
      el("button", { class: "btn", onclick: home }, "New quiz")),
    el("h2", {}, "Answer review"),
    el("ol", { class: "review" }, ...S.qs.map((q, i) => { const p = S.picks[i];
      const tag = p === null ? el("span", { class: "tag sk" }, "skipped") : p === q.answer ? el("span", { class: "tag ok" }, "correct") : el("span", { class: "tag no" }, `you: ${"ABCD"[p]}`);
      return el("li", {}, el("span", {}, t(q.q), " ", tag), el("span", { class: "ans" }, `${"ABCD"[q.answer]}. ${t(q.options[q.answer])} · ${t(q.explain)}`)); })));
  app.scrollIntoView({ block: "start" });
}
home();
</script>
